name: Auto YouTube Reup Reels

# Theo dõi 1 YouTube channel ĐÃ CÓ QUYỀN/GIẤY PHÉP reup (channel_id set cứng
# dưới đây), tự phát hiện video (kể cả video CŨ trong backlog), cắt thành
# clip 9:16 có subtitle, đăng Facebook Reels — MỖI LẦN CHẠY CHỈ ĐĂNG 1 CLIP
# (video dài chia nhiều clip thì đăng dần qua nhiều lần chạy, xem
# scripts/youtube_pipeline.mjs). Chạy trên GitHub-hosted runner.
on:
  # Lệch phút so với 2 workflow còn lại (auto-pipeline :17, news-pipeline
  # :37) nhưng CÙNG nhịp 2 tiếng/lần theo yêu cầu — chạy mỗi 2 tiếng, phút :07.
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      channel_id:
        description: "Channel ID (UC...) — để trống dùng default đã cấu hình"
        required: false
      max_clips:
        description: "Số clip tối đa đăng trong lần chạy này"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: youtube-pipeline
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install root npm deps
        run: npm install

      - name: Install Python deps (bao gồm yt-dlp)
        run: pip install -r scripts/requirements.txt

      - name: Run 1 youtube-pipeline cycle
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PYTHONIOENCODING: "utf-8"
          WHISPER_MODEL: "base"
          WHISPER_LANGUAGE: "vi"
          # Channel đã xác nhận có quyền/giấy phép reup — xem plan/lịch sử trao đổi.
          YOUTUBE_CHANNEL_ID: ${{ github.event.inputs.channel_id || 'UCqWga83LRtNEmInHryVwbMw' }}
        run: node scripts/youtube_pipeline.mjs --channel-id "$YOUTUBE_CHANNEL_ID" --max-clips "${{ github.event.inputs.max_clips || '1' }}"

      - name: Commit lại state (tránh xử lý lại video cũ)
        run: |
          git config user.name "youtube-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/youtube-pipeline-state.json || true
          git diff --cached --quiet || git commit -m "chore: cap nhat state youtube-pipeline [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push lần $i thất bại, thử lại..."
            sleep 5
          done
